<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>固收七人組 Team Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  *{box-sizing:border-box;}
  :root{
    color-scheme:light;
    --bg:#EAEEE9;--surface:#FFFFFF;--surface-2:#F3F6F2;--ink:#16231C;--ink-soft:#5A6B60;
    --line:#D2DBD3;--felt:#1F6F54;--felt-deep:#14503C;--brass:#B36A28;--brass-soft:#F4E7D6;
    --good:#2E8B62;--bad:#B4443A;
    --shadow:0 1px 2px rgba(20,40,30,.07), 0 8px 24px rgba(20,40,30,.09);--radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme:dark;
      --bg:#0F1512;--surface:#18201B;--surface-2:#1F2822;--ink:#E7EEE8;--ink-soft:#9BAAA1;
      --line:#2C3830;--felt:#2A8A68;--felt-deep:#14503C;--brass:#E0954F;--brass-soft:#3B2F22;
      --good:#4FBF95;--bad:#E08278;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
    }
  }
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  img{max-width:100%;}
  [hidden]{display:none !important;}
  .wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 32px;
    display:flex;flex-direction:column;gap:16px;}

  .eyebrow{font-size:11px;letter-spacing:.2em;color:var(--brass);font-weight:700;margin:0 0 2px;}
  h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(28px,6.4vw,40px);margin:0;letter-spacing:.06em;}
  h1 .en2{display:block;font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700;
    font-size:clamp(11px,2.6vw,13px);letter-spacing:.34em;color:var(--brass);margin-top:7px;}
  .tagline{color:var(--ink-soft);font-size:13.5px;margin:6px 0 0;}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .stat{background:var(--surface);padding:9px 14px;}
  .stat .k{font-size:11px;letter-spacing:.14em;color:var(--ink-soft);display:block;}
  .stat .v{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;
    font-weight:700;font-size:20px;line-height:1.3;display:block;}
  .stat.best .v{color:var(--brass);}

  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .btn{font:inherit;font-size:13.5px;cursor:pointer;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);padding:7px 16px;border-radius:999px;}
  .btn:hover{border-color:var(--felt);color:var(--felt);}
  .btn.primary{background:var(--felt);border-color:var(--felt);color:#fff;}
  .btn.primary:hover{background:var(--felt-deep);border-color:var(--felt-deep);color:#fff;}
  .btn.small{font-size:12.5px;padding:5px 12px;}
  .spacer{flex:1 1 auto;}
  button:focus-visible,.card:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}

  /* ---- 牌桌：14 張 ---- */
  .board-shell{position:relative;}
  .board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;}
  @media (max-width:880px){ .board{grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;} }
  @media (max-width:560px){ .board{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;} }

  .card{all:unset;display:block;position:relative;aspect-ratio:1;max-width:100%;cursor:pointer;
    perspective:900px;border-radius:12px;}
  .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.35,.85,.35,1);}
  .card.flipped .inner{transform:rotateY(180deg);}
  .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:12px;overflow:hidden;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;box-shadow:var(--shadow);padding:7px;}
  .cover{background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.045) 0 6px, transparent 6px 12px),
    linear-gradient(150deg,var(--felt) 0%,var(--felt-deep) 100%);}
  .cover::after{content:"";width:42%;aspect-ratio:1;border:1.5px solid rgba(235,200,150,.5);
    transform:rotate(45deg);border-radius:3px;}
  .face{transform:rotateY(180deg);}

  /* 名字卡 */
  .face.q{background:linear-gradient(160deg,var(--felt) 0%,var(--felt-deep) 100%);color:#fff;}
  .face.q .zh{font-family:"Noto Serif TC",serif;font-weight:700;
    font-size:clamp(18px,3.2vw,26px);line-height:1.2;letter-spacing:.04em;}
  .face.q .en{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:500;
    font-size:clamp(8px,1.15vw,10.5px);letter-spacing:.1em;line-height:1.35;
    color:rgba(255,255,255,.66);margin-top:5px;overflow-wrap:anywhere;}

  /* 照片卡 */
  .face.a{background:var(--surface);border:1px solid var(--line);padding:0;}
  .face.a img{width:100%;height:100%;object-fit:cover;display:block;}

  .card.matched .face{box-shadow:0 0 0 2px var(--good) inset, var(--shadow);}
  .card.matched{cursor:default;animation:pop .3s ease;}
  @keyframes pop{50%{transform:scale(1.05);}}

  .win{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);
    backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;border-radius:var(--radius);text-align:center;padding:16px;}
  .win h2{font-family:"Noto Serif TC",serif;font-size:24px;margin:0;}
  .win p{margin:0;}
  .win .score{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;}
  .win .note{font-size:12.5px;color:var(--ink-soft);}
  .win .note.ok{color:var(--good);}
  .win .note.err{color:var(--bad);}

  /* ---- 區塊 ---- */
  .sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .sheet-head{display:flex;align-items:baseline;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--line);}
  .sheet-head h2{font-family:"Noto Serif TC",serif;font-size:16px;margin:0;}
  .sheet-head .sub{font-size:12px;color:var(--ink-soft);margin-left:auto;}

  /* 成員名單 */
  .roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);}
  @media (max-width:700px){ .roster{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .member{background:var(--surface);padding:12px 14px;display:flex;align-items:center;gap:11px;min-height:70px;}
  .member .av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;display:block;
    border:1px solid var(--line);}
  .member .av.blank{background:var(--surface-2);display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);font-size:17px;font-family:"Noto Serif TC",serif;}
  .member .zh{font-family:"Noto Serif TC",serif;font-weight:700;font-size:16.5px;line-height:1.25;}
  .member .en{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;
    color:var(--ink-soft);margin-top:2px;overflow-wrap:anywhere;}
  .member.locked .zh{color:var(--ink-soft);font-weight:400;font-size:14px;font-family:inherit;}

  .namerow{display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--surface-2);
    border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .namerow label{font-size:13px;color:var(--ink-soft);flex:none;}
  input[type="text"]{font:inherit;font-size:14.5px;font-weight:500;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 11px;min-width:0;}
  .namerow input{flex:1 1 150px;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);padding:8px 16px;}
  td{padding:9px 16px;border-top:1px solid var(--line);}
  tbody tr.me{background:var(--brass-soft);}
  .rank{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--ink-soft);width:1%;white-space:nowrap;}
  tbody tr:nth-child(1) .rank{color:var(--brass);}
  .num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;width:1%;white-space:nowrap;}
  .empty{padding:16px;font-size:13px;color:var(--ink-soft);}
  .lbfoot{display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);
    background:var(--surface-2);font-size:12px;color:var(--ink-soft);flex-wrap:wrap;}

  /* 結語（七組全對後解鎖） */
  .finale{overflow:hidden;}
  .finale .groupshot{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;}
  @media (min-width:700px){ .finale .groupshot{aspect-ratio:16/9;} }
  .finale-body{padding:20px 22px 24px;display:flex;flex-direction:column;gap:11px;}
  .finale-body h2{font-family:"Noto Serif TC",serif;font-size:clamp(21px,4.2vw,27px);
    margin:0;letter-spacing:.04em;}
  .finale-body p{margin:0;font-size:15px;line-height:1.85;max-width:60ch;}
  .finale-body .lead{color:var(--ink-soft);}
  .finale-body .sign{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11.5px;
    letter-spacing:.22em;color:var(--brass);margin-top:5px;}
  .finale.reveal{animation:rise .55s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){ .finale.reveal{animation:none;} }

  footer{font-size:11.5px;color:var(--ink-soft);text-align:center;line-height:1.7;}
  @media (prefers-reduced-motion: reduce){ .inner{transition:none;} .card.matched{animation:none;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">排位賽</p>
    <h1>固收七人組<span class="en2">TEAM MATCH</span></h1>
    <p class="tagline">翻開名字，再翻出本人 — 七組全配對完成就過關。步數越少、時間越短，排名越前面。</p>
  </header>

  <div class="stats">
    <div class="stat"><span class="k">步數</span><span class="v" id="moves">0</span></div>
    <div class="stat"><span class="k">時間</span><span class="v" id="clock">0:00</span></div>
    <div class="stat best"><span class="k">我的最佳</span><span class="v" id="best">—</span></div>
  </div>

  <div class="bar">
    <button type="button" class="btn" id="sound" aria-pressed="true">🔊 音效</button>
    <span class="spacer"></span>
    <button type="button" class="btn primary" id="restart">重新洗牌</button>
  </div>

  <div class="board-shell">
    <div class="board" id="board"></div>
    <div class="win" id="win" hidden>
      <h2>七組全對，過關</h2>
      <p class="score" id="winScore"></p>
      <p class="note" id="winNote"></p>
      <p class="note" id="winMore">往下滑，還有一段話 ↓</p>
      <button type="button" class="btn primary" id="again">再來一輪</button>
    </div>
  </div>

  <section class="sheet">
    <div class="sheet-head">
      <h2>成員名單</h2>
      <span class="sub" id="rosterSub">配對成功後逐位解鎖</span>
    </div>
    <div class="roster" id="roster"></div>
  </section>

  <section class="sheet finale" id="finale" hidden>
    <img class="groupshot" id="groupshot" alt="固定收益科團隊合照">
    <div class="finale-body">
      <h2>恭喜你全部認完</h2>
      <p class="lead">你認我們七個，比我們自己認同事還快。</p>
      <p>以後挑券、要報價，或客戶丟出一個你沒聽過的條款，直接找我們——認臉不認編制。謝謝你一路挺債券，固定收益科會繼續把好東西擺上架。</p>
      <p class="sign">— 固定收益科</p>
    </div>
  </section>

  <section class="sheet">
    <div class="sheet-head">
      <h2>排行榜</h2>
      <span class="sub" id="lbSub"></span>
    </div>
    <div class="namerow">
      <label for="myName">你的名字</label>
      <input id="myName" type="text" maxlength="12" autocomplete="off" placeholder="打完成績會用這個名字上榜">
    </div>
    <table>
      <thead><tr><th class="rank">#</th><th>玩家</th><th class="num">步數</th><th class="num">時間</th></tr></thead>
      <tbody id="lbBody"></tbody>
    </table>
    <div class="empty" id="lbEmpty">還沒有人完成，第一名等你來拿。</div>
    <div class="lbfoot">
      <span id="lbStatus">排行榜每 8 秒自動更新</span>
      <span class="spacer"></span>
      <button type="button" class="btn small" id="refreshLb">立即更新</button>
    </div>
  </section>

  <footer>僅供內部使用，請勿對外轉傳。</footer>
</div>

  var LS_NAME = "team.name";
  var LS_BEST = "team.best";
  var LS_FINALE = "team.finale";

  var el = {};
  ["moves","clock","best","board","win","winScore","winNote","again","restart","sound",
   "roster","rosterSub","myName","lbBody","lbSub","lbEmpty","lbStatus","refreshLb",
   "finale","groupshot","winMore"]
    .forEach(function (k) { el[k] = document.getElementById(k); });

  var state = {
    cards: [], open: [], matchedIds: [], moves: 0,
    startedAt: 0, elapsed: 0, timer: null, busy: false,
    soundOn: true, myName: "", myBest: null, rows: []
  };

  function lsGet(k, f) { try { var r = localStorage.getItem(k); return r === null ? f : JSON.parse(r); } catch (e) { return f; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function fmt(s) { var m = Math.floor(s / 60), x = s % 60; return m + ":" + (x < 10 ? "0" : "") + x; }

  var actx = null;
  function beep(f, d, t) {
    if (!state.soundOn) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = t || "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.07, actx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + d + 0.02);
    } catch (e) {}
  }

  /* ---------------- 成員名單 ---------------- */
  function renderRoster() {
    el.roster.innerHTML = "";
    var done = 0;
    PEOPLE.forEach(function (p) {
      var open = state.matchedIds.indexOf(p.id) !== -1;
      if (open) done++;
      var m = document.createElement("div");
      m.className = "member" + (open ? "" : " locked");

      if (open) {
        var im = document.createElement("img");
        im.className = "av"; im.src = p.photo; im.alt = p.zh;
        m.appendChild(im);
        var box = document.createElement("div");
        var zh = document.createElement("div"); zh.className = "zh"; zh.textContent = p.zh;
        var en = document.createElement("div"); en.className = "en"; en.textContent = p.en;
        box.appendChild(zh); box.appendChild(en);
        m.appendChild(box);
      } else {
        var ph = document.createElement("div");
        ph.className = "av blank"; ph.textContent = "？";
        m.appendChild(ph);
        var box2 = document.createElement("div");
        var zh2 = document.createElement("div"); zh2.className = "zh"; zh2.textContent = "配對後解鎖";
        box2.appendChild(zh2);
        m.appendChild(box2);
      }
      el.roster.appendChild(m);
    });
    // 補滿最後一列，避免空格露出底色
    var fill = (4 - (PEOPLE.length % 4)) % 4;
    for (var k = 0; k < fill; k++) {
      var blank = document.createElement("div");
      blank.className = "member";
      el.roster.appendChild(blank);
    }
    el.rosterSub.textContent = done + " / " + PEOPLE.length + " 位已解鎖";
  }

  /* ---------------- 發牌 ---------------- */
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildFace(kind, p) {
    var f = document.createElement("div");
    f.className = "side face " + (kind === "q" ? "q" : "a");
    if (kind === "q") {
      var zh = document.createElement("div"); zh.className = "zh"; zh.textContent = p.zh;
      var en = document.createElement("div"); en.className = "en"; en.textContent = p.en;
      f.appendChild(zh); f.appendChild(en);
    } else {
      var im = document.createElement("img"); im.src = p.photo; im.alt = "";
      f.appendChild(im);
    }
    return f;
  }

  function stopTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }
  function tick() {
    state.elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
    el.clock.textContent = fmt(state.elapsed);
  }

  function deal() {
    stopTimer();
    state.cards = []; state.open = []; state.matchedIds = []; state.moves = 0;
    state.elapsed = 0; state.busy = false; state.startedAt = 0;
    el.moves.textContent = "0"; el.clock.textContent = "0:00";
    el.win.hidden = true; el.winNote.textContent = ""; el.winNote.className = "note";

    var slots = [];
    PEOPLE.forEach(function (p) { slots.push({ p: p, kind: "q" }); slots.push({ p: p, kind: "a" }); });
    shuffle(slots);

    el.board.innerHTML = "";
    slots.forEach(function (s, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "card";
      b.setAttribute("aria-label", "第 " + (i + 1) + " 張牌，尚未翻開");
      var inner = document.createElement("div"); inner.className = "inner";
      var cover = document.createElement("div"); cover.className = "side cover";
      inner.appendChild(cover);
      inner.appendChild(buildFace(s.kind, s.p));
      b.appendChild(inner);
      el.board.appendChild(b);
      var card = { node: b, pairId: s.p.id, kind: s.kind, done: false };
      state.cards.push(card);
      b.addEventListener("click", function () { flip(card); });
    });

    renderRoster();
    showMyBest();
  }

  function flip(card) {
    if (state.busy || card.done || state.open.indexOf(card) !== -1) return;
    if (!state.startedAt) { state.startedAt = Date.now(); state.timer = setInterval(tick, 250); }
    card.node.classList.add("flipped");
    card.node.setAttribute("aria-label", "已翻開");
    state.open.push(card);
    beep(520, 0.06, "triangle");
    if (state.open.length < 2) return;

    state.moves++;
    el.moves.textContent = String(state.moves);
    var a = state.open[0], b = state.open[1];

    if (a.pairId === b.pairId && a.kind !== b.kind) {
      a.done = b.done = true;
      a.node.classList.add("matched"); b.node.classList.add("matched");
      state.open = []; state.matchedIds.push(a.pairId);
      renderRoster();
      beep(780, 0.12); setTimeout(function () { beep(1040, 0.14); }, 90);
      if (state.matchedIds.length === PEOPLE.length) finish();
    } else {
      state.busy = true;
      setTimeout(function () {
        a.node.classList.remove("flipped"); b.node.classList.remove("flipped");
        a.node.setAttribute("aria-label", "尚未翻開");
        b.node.setAttribute("aria-label", "尚未翻開");
        state.open = []; state.busy = false;
      }, 820);
      beep(220, 0.09, "square");
    }
  }

  // 七組全對後解鎖結語；看過一次就永久保留
  function unlockFinale(animate) {
    if (!el.finale.hidden) return;
    el.groupshot.src = GROUP_PHOTO;
    el.finale.hidden = false;
    if (animate) el.finale.classList.add("reveal");
    lsSet(LS_FINALE, true);
  }

  function better(a, b) {
    if (!b) return true;
    if (a.moves !== b.moves) return a.moves < b.moves;
    return a.time < b.time;
  }
  function showMyBest() { el.best.textContent = state.myBest ? state.myBest.moves + " 步" : "—"; }

  function finish() {
    stopTimer(); tick();
    unlockFinale(true);
    var run = { moves: state.moves, time: state.elapsed };
    el.winScore.textContent = run.moves + " 步 · " + fmt(run.time);
    el.win.hidden = false;
    [0, 140, 280].forEach(function (d, i) { setTimeout(function () { beep([660, 880, 1170][i], 0.16); }, d); });

    if (better(run, state.myBest)) { state.myBest = run; lsSet(LS_BEST, run); showMyBest(); }

    if (!state.myName) {
      el.winNote.textContent = "想上排行榜的話，到下面填一下名字再打一輪。";
      return;
    }
    if (!SB_ON) {
      el.winNote.textContent = "排行榜還沒設定連線，成績只記在這台裝置。";
      return;
    }
    el.winNote.textContent = "上傳中…";
    submitScore(state.myName, run.moves, run.time);
  }

  /* ---------------- Supabase 排行榜 ---------------- */
  function sbHeaders(extra) {
    var h = { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY };
    if (extra) Object.keys(extra).forEach(function (k) { h[k] = extra[k]; });
    return h;
  }

  function sbError(status, body) {
    var txt = String(body || ""), msg;
    if (status === 404 || txt.indexOf("does not exist") !== -1 || txt.indexOf("PGRST205") !== -1) {
      msg = "找不到資料表 flip_scores，請回 Supabase 的 SQL Editor 把建表指令跑一次";
    } else if (status === 401) {
      msg = "金鑰不正確，請檢查 Secrets 的 SUPABASE_ANON_KEY";
    } else if (status === 403) {
      msg = "權限被擋，請確認建表指令裡兩個 policy 有建立成功";
    } else if (status === 400) {
      msg = "資料被資料庫擋下（名字太長或數值超出範圍）";
    } else {
      msg = "HTTP " + status;
    }
    var e = new Error(msg);
    e.detail = txt.slice(0, 300);
    return e;
  }

  function submitScore(name, moves, seconds) {
    fetch(SB_URL + "/rest/v1/flip_scores", {
      method: "POST",
      headers: sbHeaders({ "Content-Type": "application/json", "Prefer": "return=minimal" }),
      body: JSON.stringify({ board: BOARD_ID, name: name, moves: moves, seconds: seconds })
    }).then(function (res) {
      if (!res.ok) return res.text().then(function (t) { throw sbError(res.status, t); });
      el.winNote.className = "note ok";
      el.winNote.textContent = "成績已上排行榜 ✓";
      loadBoard();
    }).catch(function (e) {
      el.winNote.className = "note err";
      el.winNote.textContent = "成績沒送出去：" + (e && e.message ? e.message : "連不上資料庫");
      if (e && e.detail) console.error("Supabase:", e.detail);
    });
  }

  function loadBoard() {
    if (!SB_ON) {
      el.lbStatus.textContent = "排行榜尚未設定連線";
      el.lbEmpty.textContent = "排行榜還沒接上資料庫，請在 Streamlit 的 Secrets 填入連線資訊。";
      return;
    }
    var url = SB_URL + "/rest/v1/flip_scores"
            + "?board=eq." + encodeURIComponent(BOARD_ID)
            + "&select=name,moves,seconds&order=moves.asc,seconds.asc&limit=400";
    fetch(url, { headers: sbHeaders() })
      .then(function (res) {
        if (!res.ok) return res.text().then(function (t) { throw sbError(res.status, t); });
        return res.json();
      })
      .then(function (data) {
        var seen = {}, out = [];
        (data || []).forEach(function (r) {
          if (!r || typeof r.name !== "string" || seen[r.name]) return;
          seen[r.name] = true; out.push(r);
        });
        state.rows = out.slice(0, 20);
        renderBoard();
        el.lbStatus.textContent = "更新於 " + new Date().toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      })
      .catch(function (e) {
        el.lbStatus.textContent = "排行榜讀取失敗：" + (e && e.message ? e.message : "連不上資料庫");
        if (e && e.detail) console.error("Supabase:", e.detail);
      });
  }

  function renderBoard() {
    el.lbSub.textContent = state.rows.length ? state.rows.length + " 人上榜" : "";
    el.lbEmpty.hidden = state.rows.length > 0;
    el.lbBody.innerHTML = "";
    state.rows.forEach(function (r, i) {
      var tr = document.createElement("tr");
      if (state.myName && r.name === state.myName) tr.className = "me";
      var c1 = document.createElement("td"); c1.className = "rank"; c1.textContent = String(i + 1);
      var c2 = document.createElement("td");
      c2.textContent = r.name + (state.myName && r.name === state.myName ? "（你）" : "");
      var c3 = document.createElement("td"); c3.className = "num"; c3.textContent = r.moves;
      var c4 = document.createElement("td"); c4.className = "num"; c4.textContent = fmt(r.seconds);
      tr.appendChild(c1); tr.appendChild(c2); tr.appendChild(c3); tr.appendChild(c4);
      el.lbBody.appendChild(tr);
    });
  }

  /* ---------------- 事件 ---------------- */
  el.restart.addEventListener("click", deal);
  el.again.addEventListener("click", deal);
  el.refreshLb.addEventListener("click", loadBoard);
  el.sound.addEventListener("click", function () {
    state.soundOn = !state.soundOn;
    el.sound.setAttribute("aria-pressed", String(state.soundOn));
    el.sound.textContent = state.soundOn ? "🔊 音效" : "🔇 靜音";
  });
  el.myName.addEventListener("input", function () {
    state.myName = el.myName.value.replace(/\s+/g, " ").trim().slice(0, 12);
    lsSet(LS_NAME, state.myName);
    renderBoard();
  });

  /* ---------------- 啟動 ---------------- */
  var nm = lsGet(LS_NAME, "");
  if (typeof nm === "string" && nm) { state.myName = nm; el.myName.value = nm; }
  var b = lsGet(LS_BEST, null);
  if (b && typeof b.moves === "number") state.myBest = b;
  if (lsGet(LS_FINALE, false)) unlockFinale(false);

  deal();
  loadBoard();
  setInterval(loadBoard, 8000);
})();
</script>
</body>
</html>
